services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.snork.co,lothlorien.snork.co:3000,10.0.0.7:3000 # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts

    networks:
        - homelab

networks:
  homelab:
    external: true

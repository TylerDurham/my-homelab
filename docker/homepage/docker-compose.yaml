services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    env_file: .env
    networks:
      - homelab
    ports:
      - "3000:3000"
    volumes:
      - /docker/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  homelab:
    external: true

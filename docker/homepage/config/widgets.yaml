---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- resources:
    cpu: true
    memory: true
    disk: /

- search:
    provider: custom
    url: https://search.snork.co/search?q=
    target: _blank
    focus: true                          # optional: cursor lands in the search bar on load
    suggestionUrl: https://search.snork.co/autocompleter?q=
    showSearchSuggestions: true
    
- unifi_console:
    url: "{{HOMEPAGE_VAR_UNIFI_URL}}"
    site: UCG Fiber Home # optional
    key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"

    - TrueNAS:
        href: https://truenas.snork.co
        icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/truenas-scale.png?raw=true
    - KVM (TrueNAS on Gondor):
        href: https://kvm-truenas.snork.co
        icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/glinet-dark.png?raw=true
    - Immich (Admin):
        href: https://immich.snork.co/admin/system-settings 
        icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/immich.png?raw=true
    - Synology DSM:
        href: https://shire.snork.co
        icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/synology-dsm.png?raw=true
    - Plex:
        href: https://plex.snork.co
        icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/plex.png?raw=true
    - ProxMox:
        href: https://proxmox.snork.co
        icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/proxmox.png?raw=true 

- AI:
    - ChatLLM Teams:
         href: https://apps.abacus.ai/chatllm/
         description: ChatLLM for Teams
         icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/abacus_ai.png?raw=true
    - Claude.AI:
         href: https://claude.ai
         description: Claude AI
         icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/claude.png?raw=true
    - Grok:
         href: https://grok.com
         description: Claude AI
         icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/grok-dark.png?raw=true
- Infrastructure:
    - UniFi Network:
        icon: unifi.svg
        href: "{{HOMEPAGE_VAR_UNIFI_URL}}"
        description: UniFi Controller
        widget:
          type: unifi
          url: "{{HOMEPAGE_VAR_UNIFI_URL}}"
          key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
          fields: ["uptime", "wan", "wlan_users", "lan_users"]
    - Proxmox:
        icon: proxmox.png
        href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
        widget:
          type: proxmox
          node: "{{HOMEPAGE_VAR_PROXMOX_NODE}}"
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
    - Nginx Proxy Manager:
        icon: https://github.com/TylerDurham/my-icons/blob/master/apps/services/nginx-proxy-manager.png?raw=true
        href: "{{HOMEPAGE_VAR_NPM_URL}}"
        widget:
          type: npm
          url: "{{HOMEPAGE_VAR_NPM_URL}}"
          username: "{{HOMEPAGE_VAR_NPM_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NPM_PASSWORD}}"

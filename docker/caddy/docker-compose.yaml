services:
  caddy:
    build: .
    image: homelab/caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certs + ACME account key — do not lose this
      - caddy_config:/config
    networks:
      - homelab
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  homelab:
    external: true

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    # Reached by Caddy over the homelab network; no published port needed.
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - WEBUI_URL=${WEBUI_URL}
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - homelab
    restart: always

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    networks:
      - homelab
    restart: unless-stopped

volumes:
  open-webui:

networks:
  homelab:
    external: true

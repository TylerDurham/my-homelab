services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - SEARXNG_BASE_URL=https://search.snork.co/
    volumes:
      - ./searxng:/etc/searxng
    networks:
      - homelab

networks:
  homelab:
    external: true
